version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: evcharging-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - evcharging-network

  api-gateway:
    build:
      context: .
      dockerfile: src/gateway/ApiGateway/Dockerfile
    container_name: evcharging-api-gateway
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      ASPNETCORE_URLS: http://+:80
    depends_on:
      - user-service
      - station-service
      - booking-service
      - payment-service
      - notification-service
      - report-service
    networks:
      - evcharging-network

  user-service:
    build:
      context: .
      dockerfile: src/services/UserService/Dockerfile
    container_name: evcharging-user-service
    restart: always
    ports:
      - "5002:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_User;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  station-service:
    build:
      context: .
      dockerfile: src/services/StationService/Dockerfile
    container_name: evcharging-station-service
    restart: always
    ports:
      - "5004:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_Station;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  booking-service:
    build:
      context: .
      dockerfile: src/services/BookingService/Dockerfile
    container_name: evcharging-booking-service
    restart: always
    ports:
      - "5006:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      # Swagger chỉ bật khi Development (Program.cs); mặc định Docker = Production → /swagger 404
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_Booking;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  payment-service:
    build:
      context: .
      dockerfile: src/services/PaymentService/Dockerfile
    container_name: evcharging-payment-service
    restart: always
    ports:
      - "5008:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_Payment;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  notification-service:
    build:
      context: .
      dockerfile: src/services/NotificationService/Dockerfile
    container_name: evcharging-notification-service
    restart: always
    ports:
      - "5010:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_Notification;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  report-service:
    build:
      context: .
      dockerfile: src/services/ReportService/Dockerfile
    container_name: evcharging-report-service
    restart: always
    ports:
      - "5012:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=EVChargingStation_Report;Uid=root;Pwd=root;
    depends_on:
      - mysql
    networks:
      - evcharging-network

  web-app:
    build:
      context: .
      dockerfile: src/frontend/EVChargingStation.Web/Dockerfile
    container_name: evcharging-web-app
    ports:
      - "5014:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ApiSettings__BaseUrl: http://api-gateway:80
    depends_on:
      - api-gateway
    networks:
      - evcharging-network

volumes:
  mysql_data:

networks:
  evcharging-network:
    driver: bridge